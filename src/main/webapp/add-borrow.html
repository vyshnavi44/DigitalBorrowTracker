<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Borrow Record - Digital Borrow &amp; Return Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            margin: 0;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 18px 40px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        /* FORM CARD */

        .form-card {
            background-color: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        /* ICON */

        .form-icon {
            width: 70px;
            height: 70px;

            background-color: #2563eb;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 32px;
        }

        /* HEADING */

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;

            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        /* SUBMIT BUTTON */

        .submit-btn {
            width: 100%;
            padding: 14px;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        /* BACK LINK */

        .back-link {
            display: block;
            text-align: center;

            margin-top: 25px;

            text-decoration: none;
            color: #2563eb;

            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 18px 20px;
            }

            .navbar h2 {
                font-size: 18px;
            }

            .container {
                margin: 30px auto;
            }

            .form-card {
                padding: 30px 25px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>
            Digital Borrow &amp; Return Tracker
        </h2>

    </div>

    <div class="container">

        <div class="form-card">

            <div class="form-icon">
                📦
            </div>

            <h1>
                Add Borrow Record
            </h1>

            <form action="add-borrow" method="post">

                <div class="form-group">

                    <label for="item_name">
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="item_name"
                        name="item_name"
                        placeholder="Enter item name"
                        required>

                </div>

                <div class="form-group">

                    <label for="borrower_name">
                        Borrower Name
                    </label>

                    <input
                        type="text"
                        id="borrower_name"
                        name="borrower_name"
                        placeholder="Enter borrower's name"
                        required>

                </div>

                <div class="form-group">

                    <label for="borrow_date">
                        Borrow Date
                    </label>

                    <input
                        type="date"
                        id="borrow_date"
                        name="borrow_date"
                        required>

                </div>

                <div class="form-group">

                    <label for="expected_return_date">
                        Expected Return Date
                    </label>

                    <input
                        type="date"
                        id="expected_return_date"
                        name="expected_return_date"
                        required>

                </div>

                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>

                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="Enter any additional notes"></textarea>

                </div>

                <button
                    type="submit"
                    class="submit-btn">

                    ➕ Add Borrow Record

                </button>

            </form>

            <a
                href="dashboard"
                class="back-link">

                &larr; Back to Dashboard

            </a>

            <div class="footer-text">
                Digital Borrow &amp; Return Tracker
            </div>

        </div>

    </div>

</body>

</html>
