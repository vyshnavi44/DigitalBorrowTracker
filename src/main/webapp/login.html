<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Digital Borrow &amp; Return Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            margin: 0;
            min-height: 100vh;
        }

        /* Navigation Bar */

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 18px 40px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
        }

        /* Main Container */

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        /* Login Card */

        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        /* Login Icon */

        .login-icon {
            width: 70px;
            height: 70px;
            background-color: #1f2937;
            color: white;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;

            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Login Button */

        .login-btn {
            width: 100%;
            padding: 14px;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        /* Register Link */

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 15px;
        }

        .register-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Footer */

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .navbar {
                padding: 18px 20px;
            }

            .navbar h2 {
                font-size: 18px;
            }

            .container {
                margin: 35px auto;
            }

            .login-card {
                padding: 30px 25px;
            }
        }

    </style>

</head>

<body>

    <div class="navbar">
        <h2>Digital Borrow &amp; Return Tracker</h2>
    </div>

    <div class="container">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>Welcome Back!</h1>

            <form action="login" method="post">

                <div class="form-group">

                    <label for="email">
                        Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

            <div class="footer-text">
                Digital Borrow &amp; Return Tracker
            </div>

        </div>

    </div>

</body>

</html>
